services:
  echo_server:
    image: python:3.13
    volumes:
      - ./echo_server:/app
    command: ["python3", "/app/main.py"]
    ports:
      - 8080:8080
    environment:
      - PORT=8080
  hello_world-0:
    image: python:3.13
    volumes:
      - ./helloworld_server:/app
    command: ["python3", "/app/main.py"]
    environment:
      - SERVERNAME=hello_world-0
      - PORT=8000
    ports:
      - 8000:8000
  hello_world-1:
    image: python:3.13
    volumes:
      - ./helloworld_server:/app
    command: ["python3", "/app/main.py"]
    environment:
      - SERVERNAME=hello_world-1
      - PORT=8001
    ports:
      - 8001:8001
  nginx:
    image: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - 80:80